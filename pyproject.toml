[project]
name = "seedkit"
version = "0.1.0"
description = "Toolkit for qBittorrent seedboxes on private trackers: upload stats, Hit & Run rules, safe cleanup, web dashboard and TUI"
readme = "README.md"
license = "MIT"
authors = [
    { name = "X99", email = "deadbird99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qbittorrent-api>=2026.10.0",
    "requests>=2.34.2",
    "smbprotocol>=1.17.0",
    "sqlalchemy>=2.1.3",
    "textual>=8.2.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
seedkit = "seedkit:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# The UI is in French and uses typographic characters on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.Query", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"src/seedkit/i18n_en.py" = ["E501"]
